<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - North Star Bakery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
    <img src="bakery-logo_c.png" alt="North Star Bakery logo">
    <h1>North Star Bakery</h1>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</header>
<main>
    <section>
        <h2>Contact Us</h2>
        <p>Have a question or want to place an order? Send us a message and we will be happy to help.</p>

        <form>
            <fieldset>
                <legend>Contact Information</legend>

                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone">

                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>

                <button type="submit">Send Message</button>
            </fieldset>
        </form>
    </section>
</main>
<footer>
    <p>&copy; 2026 North Star Bakery. All rights reserved.</p>
</footer>
</body>
</html>
